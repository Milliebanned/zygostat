name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (offline)
        run: node --test
      - name: Outputs match the committed data
        run: node src/build.mjs --check
      - name: Every claim, against the raw readings
        run: node src/verify.mjs
